saptarishi.storage-dir=${user.home}/saptarishi-data
saptarishi.github.token=${GITHUB_TOKEN:}

spring.datasource.url=jdbc:postgresql://localhost:5433/saptarishi?reWriteBatchedInserts=true
spring.datasource.username=${DB_USER:saptarishi}
spring.datasource.password=${DB_PASSWORD:saptarishi}

spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB